<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditor Access — ALS Consulting</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body class="als-page">

  <nav class="als-nav">
    <a href="https://alsconsulting.netlify.app" class="als-nav__logo">
      ALS Consulting &nbsp;·&nbsp; Auditor Portal
    </a>
  </nav>

  <main class="als-screen" style="display:flex;align-items:center">
    <div class="als-container als-container--narrow">

      <div style="text-align:center;margin-bottom:28px">
        <div style="display:inline-flex;width:56px;height:56px;background:var(--als-navy);
                    border-radius:12px;align-items:center;justify-content:center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
               stroke="white" stroke-width="1.5" stroke-linecap="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1 class="als-screen__title" style="margin-top:16px;margin-bottom:4px">
          Auditor access
        </h1>
        <p class="als-screen__sub" style="margin-bottom:0">
          Independent audit portal &nbsp;·&nbsp; ALS Consulting
        </p>
      </div>

      <div class="als-card">
        <div class="als-form-group">
          <label class="als-label" for="password">Auditor password</label>
          <input class="als-input" type="password" id="password"
                 placeholder="Enter your auditor password"
                 autocomplete="current-password">
        </div>

        <div id="login-error" class="als-alert als-alert--adverse als-hidden"
             style="margin-bottom:12px">
          <div class="als-alert__title">Incorrect password</div>
          Please try again.
        </div>

        <button class="als-btn als-btn--primary" id="login-btn">
          Access auditor portal &nbsp;→
        </button>
      </div>

      <p class="als-text-center als-text-xs als-text-muted als-mt-md">
        Restricted to authorized ALS Consulting auditors only.
      </p>

    </div>
  </main>

  <footer class="als-footer">
    <p class="als-footer__text">
      &copy; 2026 ALS Consulting &nbsp;·&nbsp;
      <a href="https://alsconsulting.netlify.app" class="als-footer__link">alsconsulting.netlify.app</a>
    </p>
  </footer>

<script>
  // If already authenticated go straight to dashboard
  if (sessionStorage.getItem("als_auditor_auth") === "1") {
    window.location.replace("dashboard.html");
  }

  async function checkPassword(input) {
    const encoder = new TextEncoder();
    const data = encoder.encode(input);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
  }

  document.getElementById("login-btn").addEventListener("click", handleLogin);
  document.getElementById("password").addEventListener("keydown", function(e) {
    if (e.key === "Enter") handleLogin();
  });
  document.getElementById("password").addEventListener("input", function() {
    document.getElementById("login-error").classList.add("als-hidden");
    this.classList.remove("als-input--error");
  });

  async function handleLogin() {
    const password = document.getElementById("password").value;
    const btn = document.getElementById("login-btn");

    if (!password) return;

    btn.textContent = "Verifying...";
    btn.disabled = true;

    const CORRECT_HASH = "2de21976fb39d67a6de998e26f9afc5d1f54c7199e1c300ee4ba39332b68166f";
    const inputHash = await checkPassword(password);

    if (inputHash === CORRECT_HASH) {
      sessionStorage.setItem("als_auditor_auth", "1");
      window.location.replace("dashboard.html");
    } else {
      document.getElementById("login-error").classList.remove("als-hidden");
      document.getElementById("password").classList.add("als-input--error");
      document.getElementById("password").value = "";
      document.getElementById("password").focus();
      btn.textContent = "Access auditor portal →";
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
